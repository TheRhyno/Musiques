  <style>
    body {
      margin: 0;
      font-family: 'Segoe UI', sans-serif;
      background-color: #121212;
      color: #fff;
      display: flex;
      flex-direction: column;
      height: 100vh;
    }
    header {
      padding: 1rem;
      background-color: #1db954;
      text-align: center;
      font-size: 1.5rem;
      font-weight: bold;
    }
    .container {
      flex: 1;
      display: flex;
      flex-direction: row;
      overflow: hidden;
    }
    /* Sidebar playlists */
    .playlists-sidebar {
      width: 160px;
      background: #181818;
      overflow-y: auto;
      padding: 1rem 0;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #333;
    }
    .playlists-sidebar div {
      padding: 0.8rem 1rem;
      cursor: pointer;
      user-select: none;
      border-left: 4px solid transparent;
      transition: background 0.3s, border-color 0.3s;
    }
    .playlists-sidebar div:hover {
      background: #282828;
    }
    .playlists-sidebar div.active {
      background: #1db954;
      color: #000;
      border-left-color: #1db954;
      font-weight: bold;
    }

    /* Playlist des morceaux */
    .playlist-container {
      width: 320px;
      background: #181818;
      overflow-y: auto;
      padding: 1rem;
      display: flex;
      flex-direction: column;
    }
    .search-input {
      margin-bottom: 1rem;
      padding: 0.5rem;
      font-size: 1rem;
      border: none;
      border-radius: 4px;
      background: #282828;
      color: #fff;
    }
    .track {
      padding: 0.5rem;
      border-bottom: 1px solid #333;
      cursor: pointer;
      user-select: none;
    }
    .track:hover, .track.active {
      background: #1db954;
      color: #000;
    }
    .player {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }
    .thumbnail {
      width: 200px;
      height: 200px;
      object-fit: cover;
      border-radius: 8px;
      margin-bottom: 1rem;
    }
    #now-playing {
      font-weight: bold;
      margin-bottom: 0.5rem;
    }


    .controls {
      margin-top: 1rem;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .controls button {
      background: none;
      border: none;
      color: white;
      font-size: 1.5rem;
      cursor: pointer;
      padding: 0 8px;
      user-select: none;
    }
    .controls button.active {
      color: #1db954;
    }
    .progress-bar {
      width: 80%;
      height: 5px;
      background: #333;
      margin-top: 1rem;
      position: relative;
      cursor: pointer;
      border-radius: 3px;
    }
    .progress {
      height: 5px;
      background: #1db954;
      width: 0;
      border-radius: 3px;
    }
    .time-info {
      width: 80%;
      display: flex;
      justify-content: space-between;
      font-size: 0.9rem;
      margin-top: 4px;
    }
    .volume {
      margin-top: 1rem;
      width: 80%;
    }
/* Ajoute ceci à la fin du <style> existant */

@media (max-width: 768px) {
  .playlists-sidebar {
    position: fixed;
    top: 50px; /* hauteur header */
    left: 0;
    bottom: 0;
    width: 250px;
    background: #181818;
    overflow-y: auto;
    padding: 1rem 0;
    border-right: 1px solid #333;
    transform: translateX(-100%);
    transition: transform 0.3s ease;
    z-index: 1000;
  }

  .playlists-sidebar.open {
    transform: translateX(0);
  }

  /* Pour que le reste de la page prenne tout l’espace */
  .container {
    flex-direction: column;
    margin-left: 0; /* pas de marge, car sidebar cachée */
  }
}



.playlist-container {
  width: 320px;
  background: #181818;
  padding: 1rem;
  display: block; /* ← change 'flex' à 'block' pour éviter conflit */
  position: relative; /* ← nécessaire pour positionnement absolu interne */
}


  .player {
    width: 100%;
    padding: 1rem 0.5rem;
  }

  .thumbnail {
    width: 150px;
    height: 150px;
  }

  .controls {
    flex-wrap: wrap;
    justify-content: center;
  }

  .progress-bar, .time-info, .volume, #lyrics {
    width: 95%;
  }

  #lyrics {
    font-size: 0.9rem;
    max-height: 120px;
  }
}


#lyrics {
  margin-top: 1rem;
  max-width: 80%;
  max-height: 150px;      /* Limite la hauteur */
  overflow-y: auto;       /* Active le scroll si nécessaire */
  text-align: center;
  white-space: pre-wrap;
  padding: 0.5rem;
  background-color: rgba(255, 255, 255, 0.05);
  border-radius: 6px;
}

body {
  font-family: sans-serif;
  margin: 0;
  background: #111;
  color: #fff;
  overflow-x: hidden;
}

#searchContainer {
  display: flex;
  align-items: center;
  padding: 12px 16px;
  background: #111;
  gap: 8px;
}

#searchInput {
  flex: 1;
  padding: 10px;
  font-size: 16px;
  background-color: #222;
  color: #fff;
  border: none;
  border-radius: 4px;
}

#clearSearch {
  background: none;
  border: none;
  color: #aaa;
  font-size: 18px;
  cursor: pointer;
}




#lyrics {
  background-color: #000000;   /* noir */
  color: #ffffff;
  max-height: 300px;            /* hauteur max pour scroll */
  padding: 15px;
  border: 1px solid #aaa;
  font-family: 'Arial', sans-serif;
  white-space: pre-wrap;        /* garde les retours à la ligne */
  box-sizing: border-box;
  overflow-y: auto;             /* scroll vertical */
  width: fit-content;           /* largeur selon contenu */
  max-width: 600px;             /* limite la largeur max */
  margin: 0 auto;               /* centre horizontal */
  text-align: center;           /* texte centré */
  border-radius: 10px;          /* coins arrondis */
}








.track {
  padding: 12px 16px;
  border-bottom: 1px solid #222;
  font-size: 16px;
}

@media (max-width: 600px) {
  #lyrics, #playlist, #now-playing {
    padding: 10px;
    font-size: 15px;
  }

  .track {
    font-size: 14px;
    padding: 10px;
  }

  #searchInput {
    font-size: 14px;
  }
}

.track-title {
  font-weight: bold;
}

.track-duration {
  font-size: 0.8em;
  color: gray;
  margin-top: 2px;
}

  <button
    id="clearSearch"

      position: absolute;
      right: 10px;
      top: 50%;

      background: none;
      border: none;
      color: white;
      font-size: 16px;

      <div class="time-info">

        <span id="duration">0:00</span>
      </div>

let currentPlaylistName = Object.keys(playlists)[0];

let currentTrack = 0;
let isShuffle = false;
let isRepeat = false;
let useSyncedLyrics = true;
let userToggledLyricsMode = false;


let lyricsData = [];
let currentLyricIndex = 0;

let allTracks = []; // Liste de toutes les pistes de toutes les playlists
for (let name in playlists) {
  allTracks.push(...playlists[name]);
}


const audio = document.getElementById("audio");
const progress = document.getElementById("progress");

const thumbnail = document.getElementById("thumbnail");

searchInput.addEventListener("input", toggleClearButton);




const playPauseBtn = document.getElementById("playPauseBtn");
const shuffleBtn = document.getElementById("shuffleBtn");

const durationEl = document.getElementById("duration");
const lyricsDisplay = document.getElementById("lyrics"); // Ajouté

// Affiche la sidebar playlists
function displayPlaylistsSidebar() {
  playlistsSidebar.innerHTML = "";
  Object.keys(playlists).forEach(name => {
    const div = document.createElement("div");
    div.textContent = name;
    div.classList.toggle("active", name === currentPlaylistName);
    div.onclick = () => {
      if(name !== currentPlaylistName) {
        currentPlaylistName = name;
        currentPlaylist = playlists[currentPlaylistName];
        filteredPlaylist = [...currentPlaylist];
        currentTrack = 0;
        searchInput.value = "";
        displayPlaylistsSidebar();
        displayPlaylist();
        updatePlaylistHighlight(); // ✅ Pour garder la bonne mise en surbrillance
        // ❌ Supprime ceci :
        // playTrack(currentTrack);
      }
    };
    playlistsSidebar.appendChild(div);
  });
}



document.getElementById("toggleLyricsModeBtn").addEventListener("click", () => {
  const track = filteredPlaylist[currentTrack];
  const hasSyncLyrics = track.isSynced && (track.lyrics || track.lyricsUrlSynced);

  // Toujours toggle le mode (même si les paroles ne sont pas disponibles)
  useSyncedLyrics = !useSyncedLyrics;
  userToggledLyricsMode = true;

  // Affiche un message si on active SYNC mais que ce n’est pas dispo
  if (useSyncedLyrics && !hasSyncLyrics) {
    lyricsDisplay.innerText = "⛔ Paroles synchronisées non disponibles pour ce morceau.";
  } else {
    displayLyrics(currentTrack); // recharge normalement
  }

  // Met à jour le texte du bouton
document.getElementById("toggleLyricsModeBtn").textContent =
  useSyncedLyrics ? "📃 Passer en paroles simples" : "🕓 Passer en paroles sync";
});





// Affiche la playlist filtrée
function displayPlaylist() {
  playlistDiv.innerHTML = "";

  // 🔢 Calcul de la durée totale de la playlist affichée
const totalSeconds = filteredPlaylist.reduce((sum, track) => sum + (track.duration || 0), 0);
const hours = Math.floor(totalSeconds / 3600);
const minutes = Math.floor((totalSeconds % 3600) / 60);

let totalDurationText = "⏱️ Durée totale : ";
if (hours > 0) {
  totalDurationText += `${hours}h `;
}
totalDurationText += `${minutes}min`;

  // 🏷️ Affiche la durée totale au-dessus de la playlist
  const durationDiv = document.createElement("div");
  durationDiv.style.padding = "8px";
  durationDiv.style.fontWeight = "bold";
  durationDiv.style.color = "#555";
  durationDiv.textContent = totalDurationText;
  playlistDiv.appendChild(durationDiv);

  filteredPlaylist.forEach((track, index) => {
    const div = document.createElement("div");
    div.className = "track";
    if (index === currentTrack) div.classList.add("active");

    // Image miniature à gauche
    const img = document.createElement("img");
    img.src = track.img;
    img.alt = track.title;
    img.style.width = "40px";     
    img.style.height = "40px";
    img.style.objectFit = "cover";
    img.style.marginRight = "10px";
    img.style.verticalAlign = "middle";

    // Container texte (titre + durée)
    const textContainer = document.createElement("div");
    textContainer.style.display = "inline-block";
    textContainer.style.verticalAlign = "middle";

    // Titre
    const titleSpan = document.createElement("div");
    titleSpan.textContent = track.title;
    titleSpan.style.fontWeight = "bold";

    // Durée
    const durationSpan = document.createElement("div");
    durationSpan.textContent = formatTime(track.duration || 0); // durée formatée ou 0 si manquante
    durationSpan.style.fontSize = "0.8em";
    durationSpan.style.color = "gray";
    durationSpan.style.marginTop = "2px";

    // Ajout titre + durée dans container texte
    textContainer.appendChild(titleSpan);
    textContainer.appendChild(durationSpan);

    // Ajout image + texte dans la div track
    div.appendChild(img);
    div.appendChild(textContainer);

    div.onclick = () => {
      currentTrack = index;
      playTrack(currentTrack);
      updatePlaylistHighlight();
    };

    playlistDiv.appendChild(div);
  });

  updatePlaylistHighlight(); // appeler ici pour que le surlignage soit correct à l'affichage
}



function updatePlaylistHighlight() {
  const tracks = playlistDiv.querySelectorAll(".track");
  tracks.forEach((t, i) => {
    t.classList.toggle("active", i === currentTrack);
  });
}





// Affiche les paroles selon le type de piste (sync ou non)
function displayLyrics(index) {
  const track = filteredPlaylist[index];

  currentLyricIndex = 0;
  lyricsData = [];

  // 🔥 Ce que tu veux : remettre Sync si dispo
if (!userToggledLyricsMode) {
  useSyncedLyrics = track.isSynced && (track.lyrics || track.lyricsUrlSynced);
}


  lyricsDisplay.innerText = "Chargement des paroles...";

const updateLyricsModeButton = () => {
  const btn = document.getElementById("toggleLyricsModeBtn");
  btn.textContent = useSyncedLyrics ? "📃 Passer en paroles simples" : "🕓 Passer en paroles sync";
};


  const tryLoadTextLyrics = () => {
    updateLyricsModeButton(); // 👈 Assure la mise à jour du bouton

    // 3. Si les paroles texte sont à charger via un lien externe
    if (track.lyricsUrlText) {
      fetch(track.lyricsUrlText)
        .then(response => {
          if (!response.ok) throw new Error("Erreur de chargement");
          return response.text();
        })
        .then(data => {
          lyricsDisplay.innerHTML = data
            .split('\n')
            .map(line => `<p>${line}</p>`)
            .join('');
        })
        .catch(err => {
          lyricsDisplay.innerText = "Impossible de charger les paroles.";
          console.error(err);
        });
      return;
    }

    // 2. Si les paroles texte sont incluses directement
    if (track.lyrics) {
      if (Array.isArray(track.lyrics)) {
        lyricsDisplay.innerHTML = track.lyrics.map(line => `<p>${line}</p>`).join('');
      } else if (typeof track.lyrics === 'string') {
        lyricsDisplay.innerHTML = track.lyrics.split('\n').map(line => `<p>${line}</p>`).join('');
      }
      return;
    }

    // 4. Si rien n’est disponible
    lyricsDisplay.innerText = "Aucune parole disponible.";
  };

  // 1. Mode SYNC (dans l’objet directement)
  if (useSyncedLyrics && track.isSynced && track.lyrics) {
    parseLyrics(track.lyrics);
    lyricsDisplay.innerText = "";
    updateLyricsModeButton();
    return;
  }

  // 2. Mode SYNC (via URL)
  if (useSyncedLyrics && track.isSynced && track.lyricsUrlSynced) {
    fetch(track.lyricsUrlSynced)
      .then(response => {
        if (!response.ok) throw new Error("Erreur de chargement");
        return response.text();
      })
      .then(data => {
        lyricsDisplay.innerText = "";
        parseLyrics(data);
        updateLyricsModeButton();
      })
.catch(err => {
  console.warn("Sync lyrics unavailable, fallback to text lyrics.");
  useSyncedLyrics = false;
  userToggledLyricsMode = false; // 👈 permet de rebasculer en texte ensuite
  lyricsDisplay.innerText = "Paroles synchronisées indisponibles. Affichage du mode texte.";
  updateLyricsModeButton();
  tryLoadTextLyrics();
});

    return;
  }

  // 3. Mode SYNC activé mais rien de dispo => message + fallback
  if (useSyncedLyrics) {
    useSyncedLyrics = false;
    lyricsDisplay.innerText = "Paroles synchronisées indisponibles. Affichage du mode texte.";
    updateLyricsModeButton();
    tryLoadTextLyrics();
    return;
  }

  // 4. Mode texte direct
  tryLoadTextLyrics();
}




// Affiche la ligne de paroles courante synchronisée
function displayLyricsLine(lineIndex) {
  if (lyricsData.length === 0) {
    lyricsDisplay.innerText = "Aucune parole disponible.";
    return;
  }
  if(lineIndex < 0 || lineIndex >= lyricsData.length) return;

  // Affiche la ligne courante, tu peux ici faire plus joli (ex: mettre en surbrillance)
  lyricsDisplay.innerText = lyricsData[lineIndex].text;
}

// Gestion du clic sur la barre de progression
const progressBar = document.querySelector('.progress-bar');
let isDragging = false;

progressBar.addEventListener('mousedown', (e) => {
  isDragging = true;
  seekFromEvent(e);
});
document.addEventListener('mousemove', (e) => {
  if (isDragging) seekFromEvent(e);
});
document.addEventListener('mouseup', () => {
  isDragging = false;
});

// Pour tactile
progressBar.addEventListener('touchstart', (e) => {
  isDragging = true;
  seekFromTouch(e);
});
document.addEventListener('touchmove', (e) => {
  if (isDragging) seekFromTouch(e);
});
document.addEventListener('touchend', () => {
  isDragging = false;
});

// Fonction pour touch
function seekFromTouch(e) {
  const rect = progressBar.getBoundingClientRect();
  const touch = e.touches[0];
  const percent = Math.min(Math.max(0, (touch.clientX - rect.left) / rect.width), 1);
  audio.currentTime = percent * audio.duration;
}


function seekFromEvent(e) {
  const rect = progressBar.getBoundingClientRect();
  const percent = Math.min(Math.max(0, (e.clientX - rect.left) / rect.width), 1);
  audio.currentTime = percent * audio.duration;
}

// Lecture d'une piste
function playTrack(index) {
  currentTrack = index;
  const track = filteredPlaylist[index];
  audio.src = track.url;
  nowPlaying.innerText = `🎵 ${track.title}`;
  thumbnail.src = track.img;
  audio.play();
  playPauseBtn.textContent = "⏸️";

  displayLyrics(index);
  updatePlaylistHighlight();

  clearInterval(window.lyricsInterval); // évite les doublons si on change de chanson
  if (track.isSynced) {
    window.lyricsInterval = setInterval(() => {
      if (!audio.paused) {
        updateLyrics(audio.currentTime);
      }
    }, 500);
  }
}



// Bouton play/pause
function togglePlay() {
  if (!audio.src) return;
  if (audio.paused) {
    audio.play();
    playPauseBtn.textContent = "⏸️";
  } else {
    audio.pause();
    playPauseBtn.textContent = "▶️";
  }
}

// Lecture piste suivante
function nextTrack() {
  if (isShuffle) {
    currentTrack = Math.floor(Math.random() * filteredPlaylist.length);
  } else {
    currentTrack = (currentTrack + 1) % filteredPlaylist.length;
  }
  playTrack(currentTrack);
}

// Lecture piste précédente
function prevTrack() {
  if (isShuffle) {
    currentTrack = Math.floor(Math.random() * filteredPlaylist.length);
  } else {
    currentTrack = (currentTrack - 1 + filteredPlaylist.length) % filteredPlaylist.length;
  }
  playTrack(currentTrack);
}

// Shuffle toggle
function toggleShuffle() {
  isShuffle = !isShuffle;
  shuffleBtn.classList.toggle("active", isShuffle);
}

// Repeat toggle
function toggleRepeat() {
  isRepeat = !isRepeat;
  repeatBtn.classList.toggle("active", isRepeat);
}

// Volume
function setVolume(value) {
  audio.volume = value;
}

// Format temps (mm:ss)
function formatTime(seconds) {
  const min = Math.floor(seconds / 60);
  const sec = Math.floor(seconds % 60);
  return `${min}:${sec < 10 ? "0" + sec : sec}`;
}




function parseLyrics(lrcText) {
  lyricsData = [];

  const lines = lrcText.split('\n');

  for (let line of lines) {
    const matches = [...line.matchAll(/\[(\d{2}):(\d{2})(?:\.(\d{2}))?\]/g)];
    const text = line.replace(/\[.*?\]/g, '').trim(); // Supprime tous les timestamps

    for (let match of matches) {
      const min = parseInt(match[1]);
      const sec = parseInt(match[2]);
      const ms = match[3] ? parseInt(match[3]) : 0;
      const time = min * 60 + sec + ms / 100;

      lyricsData.push({ time, text });
    }
  }

  // Tri des paroles par temps croissant
  lyricsData.sort((a, b) => a.time - b.time);
}


function updateLyrics(currentTime) {
  if (!lyricsData || lyricsData.length === 0) return;

  let currentLine = "";
  for (let i = 0; i < lyricsData.length; i++) {
    if (currentTime >= lyricsData[i].time) {
      currentLine = lyricsData[i].text;
    } else {
      break;
    }
  }

  if (lyricsDisplay.innerText !== currentLine) {
    lyricsDisplay.innerText = currentLine;
  }
}

let playlistActive = null;

function chargerPlaylist(playlist) {
  playlistActive = playlist;
  afficherMorceaux(playlist.morceaux);
}

function afficherMorceaux(morceaux) {

// Synchronisation temps et mise à jour UI
audio.ontimeupdate = () => {
  if (!audio.duration) return;

  // Mise à jour barre de progression
  const percent = (audio.currentTime / audio.duration) * 100;
  progress.style.width = percent + "%";

  // Mise à jour timer
  currentTimeEl.textContent = formatTime(audio.currentTime);
  durationEl.textContent = formatTime(audio.duration);

  // Synchronisation paroles si piste sync
  const track = filteredPlaylist[currentTrack];
  if(track.isSynced && lyricsData.length > 0) {
    // Cherche la ligne correspondant au temps actuel
    for (let i = lyricsData.length -1; i >= 0; i--) {
      if(audio.currentTime >= lyricsData[i].time) {
        if(i !== currentLyricIndex) {
          currentLyricIndex = i;
          displayLyricsLine(i);
        }
        break;
      }
    }
  }
};

// Fin de lecture
audio.onended = () => {
  if (isRepeat) {
    audio.currentTime = 0;
    audio.play();
  } else {
    nextTrack();
  }
};

// Recherche dans playlist
searchInput.oninput = () => {
  const term = searchInput.value.toLowerCase();

  if (term === "") {
    // Si recherche vide, on remet la playlist actuelle
    filteredPlaylist = [...currentPlaylist];
  } else {
    // Sinon, on filtre toutes les pistes existantes
    filteredPlaylist = allTracks.filter(track =>
      track.title.toLowerCase().includes(term)
    );
  }

  // ⚠️ NE PAS toucher à currentTrack, ni lancer playTrack

  displayPlaylist(); // Juste mettre à jour l’affichage visuel
  updatePlaylistHighlight(); // Pour garder le bon élément visuellement actif

  // Si aucun résultat, on affiche un message optionnel
if (filteredPlaylist.length === 0) {
  playlistDiv.innerHTML = "<div style='padding: 10px; opacity: 0.6'>Aucun résultat</div>";
}
};


const sidebar = document.querySelector('.playlists-sidebar');

let touchStartX = 0;
let touchEndX = 0;

document.addEventListener('touchstart', e => {
  touchStartX = e.changedTouches[0].screenX;
});

document.addEventListener('touchend', e => {
  touchEndX = e.changedTouches[0].screenX;
  handleGesture();
});

function handleGesture() {
  const swipeDistance = touchEndX - touchStartX;

  if (swipeDistance > 50) {
    sidebar.classList.add('open');
  } else if (swipeDistance < -50) {
    sidebar.classList.remove('open');
  }
}
